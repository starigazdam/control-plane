name: OpenSpec

on:
  push:
    branches: [develop]
    paths:
      - 'openspec/**'
      - '.agents/**'
      - 'docs/openspec.md'
      - 'README.md'
      - '.github/workflows/openspec.yml'
  pull_request:
    paths:
      - 'openspec/**'
      - '.agents/**'
      - 'docs/openspec.md'
      - 'README.md'
      - '.github/workflows/openspec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify pinned OpenSpec CLI version
        run: npm exec --yes --package=@fission-ai/openspec@1.14.2 -- openspec --version

      - name: Validate specs
        run: npm exec --yes --package=@fission-ai/openspec@1.14.2 -- openspec validate --all --strict --no-interactive
