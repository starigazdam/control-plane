name: ADR and Hermes consistency

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  adr-hermes-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_adr_hermes_sync.py
      - run: python3 scripts/check_plugin_http_examples.py
