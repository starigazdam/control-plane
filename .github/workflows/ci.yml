name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/ControlPlane.slnx

      - name: Build
        run: dotnet build src/ControlPlane.slnx --configuration Release --no-restore

      # Detection and execution share one source: the list of .csproj files that
      # reference Microsoft.NET.Test.Sdk. The Test step runs `dotnet test` on each
      # of those projects individually, so a test project added outside the
      # solution is still executed. The test step turns itself on as soon as the
      # first test project is added.
      - name: Detect test projects
        id: detect
        run: |
          set -euo pipefail
          projects="$(git ls-files '*.csproj' | xargs -r grep -l 'Microsoft.NET.Test.Sdk' || true)"
          if [ -n "$projects" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'projects<<PROJECTS_EOF'
            echo "$projects"
            echo 'PROJECTS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.detect.outputs.found == 'true'
        env:
          TEST_PROJECTS: ${{ steps.detect.outputs.projects }}
        run: |
          set -euo pipefail
          # No --no-build: a detected test project may live outside
          # src/ControlPlane.slnx and would not have been built above.
          while IFS= read -r proj; do
            [ -n "$proj" ] || continue
            echo "::group::dotnet test $proj"
            dotnet test "$proj" --configuration Release
            echo "::endgroup::"
          done <<< "$TEST_PROJECTS"

      - name: Skip test
        if: steps.detect.outputs.found != 'true'
        run: echo '::notice::No .NET test project found; dotnet test skipped.'

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
